<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }

  /* ─── LOCKED: never change bg/gradient/template structure ─── */
  .bg {
    position: absolute; inset: 0;
    background-image: url('{{BG_IMAGE}}');
    background-size: cover;
    background-position: center;
  }

  .gradient {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      transparent 62%,
      rgba(0,0,0,0.75) 72%,
      #000 80%
    );
  }

  .template {
    position: absolute; inset: 0;
    width: 1080px; height: 1350px;
    z-index: 10; pointer-events: none;
  }

  /* ─── LOGO ───
     z-index 5 (template overlay is transparent where the logo sits)
     top = headline_top - visual_bottom_offset - 26px
     visual_bottom_offset:
       width 480px → 292px
       width 560px → 341px
     adjust LOGO_TOP per post based on headline line count
  ─── */
  .logo-wrap {
    position: absolute;
    top: {{LOGO_TOP}}px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    z-index: 5;
  }
  .logo-wrap img { width: 100%; height: auto; display: block; }

  /* ─── LOCKED: headline z-index 15, 66px, Heebo 700 ───
     top = logo_top + visual_bottom_offset + 26px
     2-line headline → logo_top ≈ 698, headline_top ≈ 1016
     3-line headline → logo_top ≈ 640, headline_top ≈ 958
  ─── */
  .headline {
    position: absolute;
    top: {{HEADLINE_TOP}}px;
    left: 40px; right: 40px;
    font-family: 'Heebo', sans-serif;
    font-size: 66px;
    font-weight: 700;
    line-height: 1.15;
    color: #fff;
    text-align: center;
    z-index: 15;
  }
  .headline em { color: #2FBEF6; font-style: normal; }

  /* ─── LOCKED: hook bottom 50px, z-index 15 ─── */
  .hook {
    position: absolute;
    bottom: 50px;
    left: 40px; right: 40px;
    font-family: 'Heebo', sans-serif;
    font-size: 37.4px; /* LOCKED */
    font-weight: 400;
    line-height: 1.4;
    color: rgba(255,255,255,0.85);
    text-align: center;
    z-index: 15;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="gradient"></div>

<div class="logo-wrap">
  <img src="{{LOGO_IMAGE}}" alt="">
</div>

<div class="headline">{{HEADLINE}}</div>

<div class="hook">{{HOOK}}</div>

<img class="template" src="{{TEMPLATE_IMAGE}}">

</body>
</html>
