name: Ski Affiliate Weekly Reset

on:
  schedule:
    # Sunday 06:00 UTC = 08:00 Israel winter time (09:00 in summer) - marks
    # the fixed core products (rows 2-12) as unposted so Make re-sends them
    - cron: '0 6 * * 0'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  reset-status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ski-affiliate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ski-affiliate/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        run: echo "$SHEET_SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          SHEET_SERVICE_ACCOUNT_JSON: ${{ secrets.SKI_SHEET_SERVICE_ACCOUNT_JSON }}

      - name: Reset weekly rows
        run: python3 reset_weekly.py
