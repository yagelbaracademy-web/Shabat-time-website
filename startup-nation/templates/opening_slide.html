<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Heebo';
    src: url('{{FONT_URL}}') format('truetype');
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }

  .hero-photo {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    z-index: 1;
  }

  /* PNG template overlay — sits on top of photo, has built-in gradient+logo */
  .template-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2;
  }

  /* Text zone — sits in the black area below the logo (~60%+) */
  .text-zone {
    position: absolute;
    top: 62%;
    left: 56px;
    right: 56px;
    bottom: 90px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-end;
    text-align: right;
    direction: rtl;
  }

  .headline {
    font-family: 'Heebo', sans-serif;
    font-weight: 900;
    font-size: {{FONT_SIZE}}px;
    line-height: 1.12;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .headline em {
    color: #2FBEF6;
    font-style: normal;
  }

  .subtitle {
    font-family: 'Heebo', sans-serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1.4;
    color: #a0aec0;
    margin-top: 16px;
  }

  /* "SWIPE FOR MORE" — תחתית */
  .swipe-cta {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- שכבה 1: תמונה -->
<img class="hero-photo" src="{{HERO_IMAGE}}" />

<!-- שכבה 2: תבנית PNG (גרדיאנט + לוגו) -->
<img class="template-overlay" src="{{TEMPLATE_IMAGE}}" />

<!-- שכבה 3: טקסט -->
<div class="text-zone">
  <div class="headline">{{HEADLINE_HTML}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
</div>

<div class="swipe-cta">SWIPE FOR MORE ›</div>

</body>
</html>
