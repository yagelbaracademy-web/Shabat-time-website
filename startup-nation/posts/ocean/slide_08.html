<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }

  .bg {
    position: absolute; inset: 0;
    background-image: url('{{BG_IMAGE}}');
    background-size: cover;
    background-position: center 15%;
  }

  .gradient {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.52) 0%,
      rgba(0,0,0,0.10) 22%,
      rgba(0,0,0,0.04) 44%,
      rgba(0,0,0,0.62) 62%,
      rgba(0,0,0,0.88) 73%,
      #000 79%
    );
  }

  .template {
    position: absolute; inset: 0;
    width: 1080px; height: 1350px;
    z-index: 10; pointer-events: none;
  }

  .logo-wrap {
    position: absolute;
    top: 660px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    z-index: 5;
  }
  .logo-wrap img { width: 100%; height: auto; display: block; }

  .headline {
    position: absolute;
    top: 978px;
    left: 40px; right: 40px;
    font-family: 'Heebo', sans-serif;
    font-size: 58px;
    font-weight: 700;
    line-height: 1.15;
    color: #fff;
    text-align: center;
    z-index: 15;
  }
  .headline em { color: #2FBEF6; font-style: normal; }

  .hook {
    position: absolute;
    bottom: 50px;
    left: 40px; right: 40px;
    font-family: 'Heebo', sans-serif;
    font-size: 37.4px;
    font-weight: 400;
    line-height: 1.4;
    color: rgba(255,255,255,0.85);
    text-align: center;
    z-index: 15;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="gradient"></div>

<div class="logo-wrap">
  <img src="{{LOGO_IMAGE}}" alt="">
</div>

<div class="headline">
  מהאקר בגיל 16 למגן של Fortune 500 -<br>
  זה <em>הסטארטאפ ניישן</em>
</div>

<div class="hook">שתפו אם גאים בחדשנות הישראלית</div>

<img class="template" src="{{TEMPLATE_IMAGE}}">

</body>
</html>
